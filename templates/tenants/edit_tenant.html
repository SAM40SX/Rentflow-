
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Tenant | RentFlow</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.06);
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        .logo span {
            color: #0ea5e9;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input:not([type="checkbox"]) {
            width: 100%;
            padding: 13px;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #0ea5e9;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .checkbox input {
            width: 17px;
            height: 17px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #0f172a;
            color: white;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #164e63;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0e7490;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">Rent<span>Flow</span></div>

    <h1>Edit Tenant</h1>

    <p class="subtitle">
        Update the tenant's account information.
    </p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username"
                   value="{{ tenant.username }}" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email"
                   value="{{ tenant.email }}">
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phone_number"
                   value="{{ tenant.phone_number|default:'' }}">
        </div>

        <div class="form-group checkbox">
            <input type="checkbox"
                   name="is_active_account"
                   id="active"
                   {% if tenant.is_active_account %}checked{% endif %}>
            <label for="active">Active tenant account</label>
        </div>

        <button type="submit">Save Changes</button>
    </form>

    <a href="{% url 'tenant_list' %}" class="back">
        ← Back to Tenant List
    </a>

</div>

</body>
</html>
