
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Reset Successful | RentFlow</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #080d18;
        }

        .glass {
            background: rgba(17, 27, 46, 0.92);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-md text-center">

        <div class="mb-8">

            <div class="inline-flex items-center justify-center
                        w-16 h-16 rounded-2xl bg-blue-600/15
                        text-blue-400 text-2xl mb-4">

                <i class="fas fa-shield-halved"></i>

            </div>

            <h1 class="text-3xl font-extrabold text-white">
                Rent<span class="text-blue-400">Flow</span>
            </h1>

        </div>


        <div class="glass rounded-2xl p-8 shadow-2xl">

            <div class="text-emerald-400 text-6xl mb-5">
                <i class="fas fa-circle-check"></i>
            </div>

            <h2 class="text-2xl font-bold text-white mb-3">
                Password Reset Successful!
            </h2>

            <p class="text-slate-400 text-sm leading-7 mb-7">
                Your RentFlow account password has been changed
                successfully. You can now log in using your new password.
            </p>

            <a href="{% url 'login' %}"
               class="inline-block w-full py-3.5 rounded-xl
                      bg-blue-600 hover:bg-blue-700
                      text-white font-bold transition">

                <i class="fas fa-sign-in-alt mr-2"></i>
                Login to RentFlow

            </a>

        </div>


        <p class="text-center text-slate-600 text-xs mt-7">
            &copy; {% now "Y" %} RentFlow. All rights reserved.
        </p>

    </div>

</body>
</html>
